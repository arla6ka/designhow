<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; }
.popover { position: fixed; top: 64px; left: 16px; width: 240px; max-height: 100px; overflow-y: auto; border: 1px solid; }
.popover ul { margin: 0; padding: 0; list-style: none; }
.popover li { height: 30px; box-sizing: border-box; }
</style></head>
<body>
<div data-slot="combobox"><button type="button" id="open">Choose a timezone</button></div>
<p>Below</p>
<script>
document.getElementById("open").addEventListener("click", () => {
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.innerHTML = '<ul role="listbox"><li role="option">UTC</li></ul>';
  document.body.appendChild(pop);
});
</script>
</body></html>
