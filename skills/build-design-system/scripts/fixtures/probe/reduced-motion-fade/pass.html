<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @keyframes fade { from { opacity: 0; } }
  @keyframes tint { from { background-color: #ffd; color: #333; } }
  @keyframes slide { from { transform: translateY(16px); } }
  .toast { animation: fade 300ms ease-out; }
  .dialog { animation: tint 300ms ease-out; }
  .panel { transition: background-color 300ms ease-out, color 300ms ease-out; }
  .panel.open { background-color: #eef; color: #006; }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: slide 300ms ease-out; }
  }
  [hidden] { display: none; }
</style></head>
<body>
<button id="open" type="button" onclick="document.getElementById('t').hidden = false; document.getElementById('d').hidden = false; document.getElementById('p').classList.add('open')">Open</button>
<div id="t" role="status" class="toast" hidden>Saved</div>
<div id="d" role="dialog" aria-label="Details" class="dialog" hidden>Details</div>
<div id="p" class="panel">Panel</div>
</body></html>
