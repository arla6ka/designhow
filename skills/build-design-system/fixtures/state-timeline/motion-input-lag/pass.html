<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 40px; } #h { width: 48px; height: 48px; background: #333; touch-action: none; }
  #h:active { outline: 2px solid #06c; }
</style></head>
<body><div id="h" role="slider" aria-valuenow="0" tabindex="0"></div>
<script>
  const h = document.getElementById("h"); let x0 = null;
  h.addEventListener("pointerdown", (e) => { x0 = e.clientX; h.setPointerCapture(e.pointerId); });
  h.addEventListener("pointermove", (e) => { if (x0 !== null) h.style.transform = `translateX(${e.clientX - x0}px)`; });
  h.addEventListener("pointerup", () => { x0 = null; });
</script></body></html>
