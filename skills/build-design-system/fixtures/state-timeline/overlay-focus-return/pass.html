<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 40px; min-height: 600px; } button { border: 1px solid #999; background: #fff; padding: 8px 12px; }
  button:focus-visible, button[aria-expanded="true"] { outline: 2px solid #06c; outline-offset: 2px; }
  [hidden] { display: none; }
  button:not(:disabled):active { transform: scale(0.97); }
</style></head>
<body><button id="b" type="button" aria-expanded="false" aria-haspopup="menu">Options</button>
<div id="m" role="menu" hidden><button id="i" role="menuitem" type="button">Rename</button></div>
<script>
  const b = document.getElementById("b"), m = document.getElementById("m"), i = document.getElementById("i");
  const set = (open) => { const was = !m.hidden; b.setAttribute("aria-expanded", String(open)); m.hidden = !open; if (open) i.focus(); else if (was && m.contains(document.activeElement) || was && document.activeElement === document.body) b.focus(); };
  b.addEventListener("click", () => set(b.getAttribute("aria-expanded") !== "true"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false); });
  document.addEventListener("pointerdown", (e) => { if (!b.contains(e.target) && !m.contains(e.target)) set(false); });
</script>
</body></html>
