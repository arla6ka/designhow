<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 40px; } button { border: 1px solid #999; background: #fff; padding: 8px 12px; }
  button:focus-visible, button[aria-expanded="true"] { outline: 2px solid #06c; outline-offset: 2px; }
  button:active { background: #ddd; }
  #m { margin-top: 8px; padding: 8px; border: 1px solid #999; }
  #m[hidden] { display: none; }
  #m.in { animation: rise 800ms ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style></head>
<body><button id="b" type="button" aria-expanded="false" aria-haspopup="menu">Options</button>
<div id="m" role="menu" hidden><div role="menuitem" tabindex="-1">Rename</div></div>
<script>
  const b = document.getElementById("b"), m = document.getElementById("m");
  const busy = (ms) => { const end = performance.now() + ms; while (performance.now() < end) {} };
  const set = (open) => { m.hidden = !open; b.setAttribute("aria-expanded", String(open)); m.classList.toggle("in", open); if (open && window.JANK) { const t0 = performance.now(); const tick = () => { busy(40); if (performance.now() - t0 < 800) requestAnimationFrame(tick); }; requestAnimationFrame(tick); } if (!open) b.focus(); };
  b.addEventListener("click", () => set(b.getAttribute("aria-expanded") !== "true"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false); });
  document.addEventListener("pointerdown", (e) => { if (!b.contains(e.target) && !m.contains(e.target)) set(false); });
  window.JANK = false;
</script></body></html>
