<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 40px; } button { border: 1px solid #999; background: #fff; padding: 8px 12px; }
  button[aria-disabled="true"] { opacity: 0.6; }
  button:not(:disabled):active { transform: scale(0.97); }
</style></head>
<body><button id="b" type="button">Save</button>
<script>
  const b = document.getElementById("b");
  b.addEventListener("click", () => { if (b.getAttribute("aria-disabled") === "true") return; b.setAttribute("aria-disabled", "true"); setTimeout(() => b.removeAttribute("aria-disabled"), 60000); });
</script>
</body></html>
