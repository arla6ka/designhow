<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 40px; } button { border: 1px solid #999; background: #fff; padding: 8px 12px; }
  button:disabled { opacity: 0.6; }
</style></head>
<body><button id="b" type="button">Save</button>
<script>
  const b = document.getElementById("b");
  b.addEventListener("click", () => { b.disabled = true; setTimeout(() => { b.disabled = false; }, 60000); });
</script>
</body></html>
