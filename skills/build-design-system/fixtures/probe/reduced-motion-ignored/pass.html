<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes enter { from { opacity: 0; transform: scale(0.96); } }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid; border-right-color: transparent; border-radius: 50%; }
  @media (prefers-reduced-motion: no-preference) {
    .spinner { animation: spin 1s linear infinite; }
    .dialog { animation: enter 400ms ease-out; }
  }
  [hidden] { display: none; }
</style></head>
<body>
<button type="button" aria-busy="true"><span class="spinner"></span> Saving</button>
<button id="open" type="button" onclick="document.getElementById('d').hidden = false">Open</button>
<div id="d" role="dialog" aria-label="Details" class="dialog" hidden>Details</div>
</body></html>
