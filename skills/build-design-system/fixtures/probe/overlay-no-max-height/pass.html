<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 14px/1.4 sans-serif; }
  .panel { position: fixed; top: 16px; left: 16px; right: 16px; max-height: calc(100dvh - 32px); overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 16px; box-sizing: border-box; }
  .panel p { margin: 0 0 12px; }
  .scrim { position: fixed; inset: 0; overflow-y: auto; }
  .tall { margin: 16px; background: #fff; }
  #open { position: relative; z-index: 2; }
  .panel p.gap { height: 220px; }
  [hidden] { display: none; }
</style></head>
<body>
<button id="open" type="button" onclick="document.getElementById('d').hidden = false">Delete workspace</button>
<div id="d" role="dialog" aria-label="Delete workspace?" class="panel" hidden>
  <p>This removes every inbox, ticket and report.</p><p>Type the workspace name to confirm.</p><p><input aria-label="Workspace name"></p>
  <p class="gap">Members lose access at once.</p><p>Exports already sent stay with their recipients.</p>
  <p><button type="button">Keep workspace</button> <button type="button">Delete workspace</button></p>
</div>
<div class="scrim"><div role="alertdialog" aria-label="Session expiring" class="tall"><p style="height: 400px">Your session ends in 2 minutes.</p><button type="button">Stay signed in</button></div></div>
</body></html>
